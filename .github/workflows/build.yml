name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # für das Anlegen von Releases bei Tags

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT: src/AndalusKarten.App/AndalusKarten.App.csproj

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/AndalusKarten.Core.Tests -c Release

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: MAUI-Workload installieren
        run: dotnet workload install maui-android
      - name: Android-Abhängigkeiten
        run: >
          dotnet build $PROJECT -f net10.0-android -t:InstallAndroidDependencies
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=true
      - name: APK bauen
        run: >
          dotnet publish $PROJECT -f net10.0-android -c Release -o out/android
          -p:AndroidSdkDirectory="$ANDROID_HOME"
      - name: APK umbenennen
        run: |
          mkdir -p dist
          cp out/android/*-Signed.apk dist/AndalusKarten.apk
      - uses: actions/upload-artifact@v5
        with:
          name: AndalusKarten-Android
          path: dist/AndalusKarten.apk

  macos:
    needs: test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: MAUI-Workload installieren
        run: dotnet workload install maui-maccatalyst
      - name: Mac-App bauen (ad-hoc signiert)
        run: >
          dotnet publish $PROJECT -f net10.0-maccatalyst -c Release -p:MacOnly=true -p:ValidateXcodeVersion=false
          -p:CreatePackage=false -p:EnableCodeSigning=true -p:CodesignKey=-
      - name: App zippen
        run: |
          APP=$(find src/AndalusKarten.App/bin/Release/net10.0-maccatalyst -name "*.app" -maxdepth 3 | head -1)
          echo "Gefunden: $APP"
          mkdir -p dist
          ditto -c -k --keepParent "$APP" dist/AndalusKarten-macOS.zip
      - uses: actions/upload-artifact@v5
        with:
          name: AndalusKarten-macOS
          path: dist/AndalusKarten-macOS.zip

  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [android, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: Andalus Karten ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.0.{0}', github.run_number) }}
          make_latest: true
          files: |
            dist/AndalusKarten.apk
            dist/AndalusKarten-macOS.zip
